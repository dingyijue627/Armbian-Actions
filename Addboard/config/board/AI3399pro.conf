# Rockchip RK3399Pro hexa core NPU 4-8GB SoC GBe eMMC USB3 PCIe
BOARD_NAME="RPDZKJ AI3399PRO"
BOARD_VENDOR="RPDZKJ"
BOARDFAMILY="rockchip64"
BOARD_MAINTAINER=""
INTRODUCED="2019"
BOOTCONFIG="rock-pi-n10-rk3399pro_defconfig"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3399pro-tinker-edge-r.dtb"
#BOOT_SUPPORT_SPI=yes
BOOT_SCENARIO="tpl-spl-blob"
SRC_EXTLINUX="yes"
PACKAGE_LIST_BOARD="rfkill bluetooth bluez bluez-tools net-tools network-managerpulseaudio pulseaudio-module-bluetooth"
###镜像地址
MAINLINE_MIRROR="tuna"
DOWNLOAD_MIRROR="china"
##Armbian国内
ARMBIAN_MIRROR="https://mirrors.tuna.tsinghua.edu.cn/armbian"
##镜像输出压缩
COMPRESS_OUTPUTIMAGE="xz"
#安装内核头
INSTALL_HEADERS="yes"
#冻结内核
SPFREEZE="yes"

function pre_customize_image__copy_RPDZKJ_AI3399PRO_bt_firmware() {
        display_alert "RPDZKJ AI3399PRO" "Setting up Bluetooth firmware symlinks" "info"

        if [ -f "${SDCARD}/lib/firmware/brcm/brcmfmac4356-sdio.bin" ]; then
                ln -sf brcmfmac4356-sdio.bin "${SDCARD}/lib/firmware/brcm/brcmfmac43455-sdio.rpdzkj,ai3399pro.bin"
        fi
        if [ -f "${SDCARD}/lib/firmware/brcm/brcmfmac4356-sdio.txt" ]; then
                ln -sf brcmfmac4356-sdio.txt "${SDCARD}/lib/firmware/brcm/brcmfmac43455-sdio.rpdzkj,ai3399pro.txt"
        fi
        if [ -f "${SDCARD}/lib/firmware/brcm/brcmfmac4356-sdio.clm_blob" ]; then
                ln -sf brcmfmac4356-sdio.clm_blob "${SDCARD}/lib/firmware/brcm/brcmfmac43455-sdio.rpdzkj,ai3399pro.clm_blob"
        fi
}

